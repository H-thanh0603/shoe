# Scale ngang: docker compose up --build --scale app=2
# (app replicas share Redis cache/rate-limit + Postgres jobs qua SKIP LOCKED).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kinetic
      POSTGRES_PASSWORD: kinetic
      POSTGRES_DB: kinetic
    ports:
      - "5433:5432" # debug/test local trỏ vào DB container (app trong compose vẫn dùng host `postgres`)
    volumes:
      - pgdata:/var/lib/postgresql # PG18+: mount cha, data nằm trong subdir (pg_upgrade-safe)
      - ./backups:/backups # WAL archive cho PITR (xem docs/BACKUP.md)
    # WAL archiving: mọi thay đổi ship ra /backups/wal liên tục, segment xoay tối đa 5 phút
    # → RPO ~5 phút thay vì ~24h như pg_dump. Kết hợp base backup hàng tuần để PITR.
    # (dòng host replication: cho pg_basebackup của service `backup` — image PG18 mặc định thiếu)
    command: >
      sh -c "mkdir -p /backups/wal && chown -R postgres:postgres /backups/wal &&
      grep -q '^host replication' \"$${PGDATA:-/var/lib/postgresql/data}/pg_hba.conf\"
      || echo 'host replication kinetic all scram-sha-256' >> \"$${PGDATA:-/var/lib/postgresql/data}/pg_hba.conf\";
      exec docker-entrypoint.sh postgres
      -c wal_level=replica -c archive_mode=on -c archive_timeout=300
      -c \"archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f\""
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped # crash bất ngờ (vd DB failover) → tự lên lại, LB /readyz gating traffic
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 256M }
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://kinetic:kinetic@postgres:5432/kinetic
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?đặt JWT_SECRET trong .env khi deploy}
      TRUST_PROXY: 1
      CACHE_TTL_SEC: 60
    ports:
      - "3000-3002:3000" # dải port để --scale app=2..3 không đụng port
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Worker jobs riêng (không mở port): nhận job tồn/confirm dọn events khi API bận.
  worker:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kinetic:kinetic@postgres:5432/kinetic
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?đặt JWT_SECRET trong .env khi deploy}
      WORKER_ONLY: "true"

  # Cron định kỳ (mỗi 6h): enqueue dọn events + quét tồn — việc thật do worker(s) nhận.
  # Tách khỏi process API để tắt API/worker vẫn còn lịch (worker dev local vẫn tự lịch fallback).
  cron:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kinetic:kinetic@postgres:5432/kinetic
      JWT_SECRET: ${JWT_SECRET:?đặt JWT_SECRET trong .env khi deploy}
      JOBS_ENABLED: "false"
    command: ["sh", "-c", "while true; do node cron.js; sleep 21600; done"]

  # Backup Postgres: dump logic mỗi 24h (giữ 7 bản) + base backup vật lý mỗi 7 ngày (giữ 2 bản).
  # Base + WAL archive (/backups/wal) cho phép PITR về bất kỳ thời điểm nào — xem docs/BACKUP.md.
  # Quy trình restore xem docs/BACKUP.md. KHÔNG backup root .env (chứa JWT_SECRET) — giữ riêng.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: kinetic
    volumes:
      - ./backups:/backups
    command: ["sh", "-c", "mkdir -p /backups/base && while true; do F=/backups/kinetic-$$(date +%F_%H%M).dump; pg_dump -h postgres -U kinetic -Fc kinetic > $$F && echo \"backup ok: $$F\" && ls -t /backups/*.dump | tail -n +8 | xargs -r rm -f; if [ -z \"$$(find /backups/base -maxdepth 1 -mtime -7 -name 'base-*' 2>/dev/null)\" ]; then B=/backups/base/base-$$(date +%F); pg_basebackup -h postgres -U kinetic -Ft -z -D $$B && echo \"base ok: $$B\" && ls -dt /backups/base/base-* | tail -n +3 | xargs -r rm -rf; fi; sleep 86400; done"]

volumes:
  pgdata:
  redisdata:
