# Staging — bản sao prod thu nhỏ, DỮ LIỆU RIÊNG, PORT RIÊNG.
#
# Mục đích: test deploy/migration/rollback TRƯỚC khi chạm production.
# Khác prod (docker-compose.yml):
#   - project name riêng → containers/volumes/networks không đụng prod
#   - port 8100 (prod 80/443 qua nginx edge riêng) — truy cập trực tiếp
#   - DB + Redis volume riêng (pgdata_staging/redisdata_staging)
#   - backups KHÔNG mount (không ghi đè WAL prod!)
#   - JWT_SECRET bắt buộc riêng — token prod không dùng được ở staging
#     (và ngược lại) — đúng cách cô lập môi trường
#
# Cách chạy:
#   docker compose -f docker-compose.staging.yml --project-name kinetic-staging up --build -d
# Xem logs:  docker compose -f docker-compose.staging.yml logs -f app
# Xóa sạch (kèm data staging): ... down -v

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kinetic_stg
      POSTGRES_PASSWORD: kinetic_stg
      POSTGRES_DB: kinetic_stg
    volumes:
      - pgdata_staging:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic_stg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://kinetic_stg:kinetic_stg@postgres:5432/kinetic_stg
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET_STAGING:?đặt JWT_SECRET_STAGING trong .env (khác prod!)}
    # seed staging (idempotent — chỉ chèn khi bảng trống) trước khi start
    command: ["sh", "-c", "node migrate.js && node seed.js && node server.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8100:80"
    # reverse-proxy thuần staging — KHÔNG cache (muốn thấy data mới ngay),
    # KHÔNG rate-limit gắt (test),KHÔNG public domain (chỉ :8100)
    command: ["nginx", "-g", "daemon off;"]
    configs:
      - source: staging_nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  staging_nginx:
    content: |
      server {
        listen 80;
        location / {
          proxy_pass http://app:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          # SSE (assistant stream) — staging cũng cần
          location ~ ^/api/v1/assistant/ {
            proxy_pass http://app:3000;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Connection "";
          }
        }
      }

volumes:
  pgdata_staging:
  redisdata_staging:
