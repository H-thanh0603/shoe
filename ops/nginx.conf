# Nginx edge: cổng vào duy nhất từ internet (app không expose trực tiếp khi deploy).
# - LB tự động qua các replica `app` (Docker DNS round-robin) — scale ngang thật.
# - Cache GET catalog ở origin (giảm tải app; app đã bust đúng khi write).
# - Rate-limit lớp ngoài (rẻ hơn vào tới Express): chung 50r/s, auth/checkout chặt hơn.
# - gzip + IP thật chuyển cho app (TRUST_PROXY=1 phía app).
upstream api {
  server app:3000 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog:10m max_size=200m inactive=5m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 2m; # khớp express.json({limit:'2mb'}) — review kèm ảnh data-URL
  client_body_timeout 10s;
  client_header_timeout 10s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  # health nội bộ cho LB ngoài — không cache, không limit
  location = /healthz { proxy_pass http://api; access_log off; }
  location = /readyz { proxy_pass http://api; access_log off; }
  location = /metrics { proxy_pass http://api; access_log off; }

  # auth/checkout: limit chặt, KHÔNG cache (response theo user)
  location ~ ^/api/v1/(auth/(login|register|forgot-password)|orders) {
    limit_req zone=auth burst=5 nodelay;
    proxy_no_cache 1;
    proxy_pass http://api;
  }

  # catalog GET: cache origin 60s, key gồm query (page/limit/q)
  location ~ ^/api/v1/(products|collections|drop) {
    limit_req zone=general burst=100 nodelay;
    proxy_cache catalog;
    proxy_cache_valid 200 60s;
    proxy_cache_methods GET;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://api;
  }

  # còn lại (cart riêng từng user, admin, events...): limit chung, không cache
  location / {
    limit_req zone=general burst=100 nodelay;
    proxy_pass http://api;
  }
}
