# Staging nginx — tách từ top-level `configs:` (chỉ swarm mode mới đọc được).
# docker-compose.staging.yml bind-mount file này → `docker compose up` thường chạy OK.
server {
  listen 80;
  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (assistant stream) — staging cũng cần
    location ~ ^/api/v1/assistant/ {
      proxy_pass http://app:3000;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Connection "";
    }
  }
}
